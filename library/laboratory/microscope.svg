<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Microscope</title>
  <desc id="desc">Laboratory microscope with eyepiece, objective, stage and focus knob.</desc>
  <!-- SciSVG — Saveena Solanki, CC BY 4.0, https://github.com/SaveenaSolanki/SciSVG -->
  <g id="base">
    <rect x="100" y="410" width="320" height="26" rx="13" fill="#3f4c61"/>
  </g>
  <g id="arm">
    <rect x="118" y="236" width="30" height="182" rx="15" fill="#3157a4"/>
  </g>
  <g id="focus-knob">
    <circle cx="133" cy="300" r="22" fill="#b26b36" stroke="#8f5026" stroke-width="4"/>
    <circle cx="133" cy="300" r="9" fill="#f7ece0"/>
  </g>
  <g id="stage">
    <rect x="168" y="326" width="172" height="12" rx="4" fill="#3f4c61"/>
    <rect x="178" y="318" width="12" height="16" rx="2" fill="#b26b36"/>
    <rect x="296" y="318" width="12" height="16" rx="2" fill="#b26b36"/>
  </g>
  <g id="slide">
    <rect x="210" y="322" width="90" height="8" rx="3" fill="#dbe6f8" stroke="#3157a4" stroke-width="2.5"/>
  </g>
  <g id="illuminator">
    <rect x="250" y="338" width="12" height="30" fill="#8a94a6"/>
    <circle cx="256" cy="392" r="16" fill="#f7ece0" stroke="#b26b36" stroke-width="4"/>
  </g>
  <g id="body-tube" transform="rotate(24 196 200)">
    <rect x="176" y="118" width="30" height="168" rx="14" fill="#3157a4"/>
    <rect x="172" y="88" width="38" height="28" rx="8" fill="#2a7b70"/>
  </g>
  <g id="objective">
    <rect x="222" y="296" width="20" height="26" rx="8" fill="#2a7b70"/>
    <rect x="226" y="318" width="12" height="12" rx="3" fill="#3f4c61"/>
  </g>
</svg>
