<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Micropipette</title>
  <desc id="desc">Micropipette with tip ejector, volume window and a droplet.</desc>
  <!-- SciSVG — Saveena Solanki, CC BY 4.0, https://github.com/SaveenaSolanki/SciSVG -->
  <g id="plunger">
    <rect x="232" y="44" width="48" height="42" rx="10" fill="#2a7b70" stroke="#1f5c54" stroke-width="4"/>
  </g>
  <g id="body">
    <rect x="216" y="82" width="80" height="232" rx="18" fill="#dbe6f8" stroke="#3157a4" stroke-width="5"/>
  </g>
  <g id="ejector">
    <rect x="200" y="132" width="16" height="64" rx="7" fill="#b26b36" stroke="#8f5026" stroke-width="3"/>
  </g>
  <g id="volume-window">
    <rect x="232" y="124" width="48" height="44" rx="6" fill="#ffffff" stroke="#3f4c61" stroke-width="3"/>
    <rect x="240" y="136" width="14" height="10" rx="2" fill="#3f4c61"/>
    <rect x="258" y="140" width="14" height="10" rx="2" fill="#3f4c61"/>
    <rect x="240" y="152" width="14" height="10" rx="2" fill="#3f4c61" opacity="0.5"/>
  </g>
  <g id="volume-marks" stroke="#3157a4" stroke-width="3" stroke-linecap="round">
    <line x1="284" y1="180" x2="296" y2="180"/>
    <line x1="284" y1="210" x2="296" y2="210"/>
    <line x1="284" y1="240" x2="296" y2="240"/>
  </g>
  <g id="tip">
    <polygon points="236,314 280,314 266,430 250,430" fill="#3157a4" stroke="#27457f" stroke-width="3"/>
  </g>
  <g id="droplet">
    <path d="M 258 438 C 246 456 250 472 258 472 C 266 472 270 456 258 438 Z" fill="#2a7b70"/>
  </g>
</svg>
