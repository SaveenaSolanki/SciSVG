    <path d="M 318 84 C 270 180 262 330 202 428 L 162 428 C 232 330 240 180 282 84 Z"
          fill="#e5f1ee" stroke="#2a7b70" stroke-width="5" stroke-linejoin="round"/>
  </g>
  <g id="centromere">
    <circle cx="256" cy="256" r="16" fill="#b26b36" stroke="#ffffff" stroke-width="3"/>
  </g>
  <g id="telomeres" fill="#b26b36">
    <circle cx="196" cy="84" r="9"/>
    <circle cx="318" cy="84" r="9"/>
    <circle cx="162" cy="428" r="9"/>
    <circle cx="350" cy="428" r="9"/>
  </g>
