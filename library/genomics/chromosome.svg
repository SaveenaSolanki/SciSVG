<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Chromosome</title>
  <desc id="desc">Chromosome with two sister chromatids joined at the centromere.</desc>
