<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Gene Structure</title>
  <desc id="desc">Gene structure with promoter, untranslated regions, exons and introns.</desc>
  <!-- SciSVG — Saveena Solanki, CC BY 4.0, https://github.com/SaveenaSolanki/SciSVG -->
  <g id="backbone">
    <line x1="36" y1="300" x2="476" y2="300" stroke="#8a94a6" stroke-width="4"/>
  </g>
  <g id="promoter">
    <line x1="36" y1="300" x2="84" y2="300" stroke="#b26b36" stroke-width="5"/>
    <polygon points="84,286 112,300 84,314" fill="#b26b36"/>
    <rect x="48" y="284" width="20" height="32" rx="3" fill="#f7ece0" stroke="#b26b36" stroke-width="3"/>
  </g>
  <g id="utrs">
    <rect x="124" y="286" width="26" height="28" rx="4" fill="#b7d8d1" stroke="#2a7b70" stroke-width="3"/>
    <rect x="444" y="286" width="26" height="28" rx="4" fill="#b7d8d1" stroke="#2a7b70" stroke-width="3"/>
  </g>
  <g id="exons">
    <rect x="158" y="282" width="54" height="36" rx="4" fill="#3157a4"/>
    <rect x="284" y="282" width="52" height="36" rx="4" fill="#3157a4"/>
    <rect x="388" y="282" width="48" height="36" rx="4" fill="#3157a4"/>
  </g>
  <g id="introns" fill="none" stroke="#8a94a6" stroke-width="4">
    <path d="M 212 300 C 236 264 262 336 284 300"/>
    <path d="M 336 300 C 354 272 372 328 388 300"/>
  </g>
  <g id="poly-a-tail">
    <line x1="470" y1="300" x2="492" y2="300" stroke="#b9cbe8" stroke-width="5" stroke-dasharray="3 3" stroke-linecap="round"/>
  </g>
</svg>
