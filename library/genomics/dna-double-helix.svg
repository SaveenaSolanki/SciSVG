<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">DNA Double Helix</title>
  <desc id="desc">Double-stranded DNA helix with two-tone base pairs.</desc>
  <!-- SciSVG — Saveena Solanki, CC BY 4.0, https://github.com/SaveenaSolanki/SciSVG -->
  <g id="helix" transform="rotate(-16 256 256)">
    <g id="backbones" fill="none" stroke-width="8" stroke-linecap="round">
      <path d="M 210 60 C 240 110 180 160 210 210 C 240 260 180 310 210 360 C 240 410 200 440 190 452" stroke="#3157a4"/>
      <path d="M 302 60 C 272 110 332 160 302 210 C 272 260 332 310 302 360 C 272 410 312 440 322 452" stroke="#2a7b70"/>
    </g>
    <g id="base-pairs">
      <line x1="210" y1="60" x2="256" y2="60" stroke="#b26b36" stroke-width="6"/>
      <line x1="256" y1="60" x2="302" y2="60" stroke="#8a94a6" stroke-width="6"/>
      <line x1="210" y1="110" x2="256" y2="110" stroke="#b26b36" stroke-width="6"/>
      <line x1="256" y1="110" x2="302" y2="110" stroke="#8a94a6" stroke-width="6"/>
      <line x1="210" y1="160" x2="256" y2="160" stroke="#b26b36" stroke-width="6"/>
      <line x1="256" y1="160" x2="302" y2="160" stroke="#8a94a6" stroke-width="6"/>
      <line x1="210" y1="210" x2="256" y2="210" stroke="#b26b36" stroke-width="6"/>
      <line x1="256" y1="210" x2="302" y2="210" stroke="#8a94a6" stroke-width="6"/>
      <line x1="210" y1="260" x2="256" y2="260" stroke="#b26b36" stroke-width="6"/>
      <line x1="256" y1="260" x2="302" y2="260" stroke="#8a94a6" stroke-width="6"/>
      <line x1="210" y1="310" x2="256" y2="310" stroke="#b26b36" stroke-width="6"/>
      <line x1="256" y1="310" x2="302" y2="310" stroke="#8a94a6" stroke-width="6"/>
      <line x1="210" y1="360" x2="256" y2="360" stroke="#b26b36" stroke-width="6"/>
      <line x1="256" y1="360" x2="302" y2="360" stroke="#8a94a6" stroke-width="6"/>
      <line x1="210" y1="410" x2="256" y2="410" stroke="#b26b36" stroke-width="6"/>
      <line x1="256" y1="410" x2="302" y2="410" stroke="#8a94a6" stroke-width="6"/>
    </g>
    <g id="ends">
      <circle cx="210" cy="60" r="10" fill="#3157a4"/>
      <circle cx="302" cy="60" r="10" fill="#2a7b70"/>
      <circle cx="190" cy="452" r="10" fill="#3157a4"/>
      <circle cx="322" cy="452" r="10" fill="#2a7b70"/>
    </g>
  </g>
</svg>
