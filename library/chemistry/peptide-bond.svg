<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Peptide Bond</title>
  <desc id="desc">Two amino acids joined by a highlighted peptide bond with atom-style coloring.</desc>
  <!-- SciSVG — Saveena Solanki, CC BY 4.0, https://github.com/SaveenaSolanki/SciSVG -->
  <g id="bonds" stroke="#3f4c61" stroke-width="6" stroke-linecap="round">
    <line x1="118" y1="190" x2="162" y2="256"/>
    <line x1="184" y1="260" x2="240" y2="244"/>
    <line x1="260" y1="232" x2="290" y2="214"/>
    <line x1="258" y1="248" x2="288" y2="230"/>
    <line x1="360" y1="296" x2="408" y2="320"/>
    <line x1="430" y1="322" x2="458" y2="268"/>
    <line x1="474" y1="246" x2="494" y2="228"/>
    <line x1="470" y1="252" x2="490" y2="234"/>
    <line x1="170" y1="276" x2="166" y2="326"/>
    <line x1="422" y1="338" x2="440" y2="380"/>
  </g>
  <g id="peptide-bond" stroke="#b26b36" stroke-width="9" stroke-linecap="round">
