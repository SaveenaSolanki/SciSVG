<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Protein-Ligand Binding</title>
  <desc id="desc">Protein binding pocket with a small molecule ligand and dashed hydrogen-bond lines.</desc>
  <!-- SciSVG — Saveena Solanki, CC BY 4.0, https://github.com/SaveenaSolanki/SciSVG -->
  <g id="protein">
    <path d="M 64 132 C 118 64 236 72 300 118 C 342 148 356 186 348 222 C 338 246 320 258 318 282 C 316 306 332 328 318 344 C 300 366 210 380 150 366 C 92 352 46 240 64 132 Z"
          fill="#e7edf8" stroke="#3157a4" stroke-width="5" stroke-linejoin="round"/>
  </g>
  <g id="pocket-residues" fill="#b26b36">
    <circle cx="330" cy="236" r="8"/>
    <circle cx="324" cy="296" r="8"/>
    <circle cx="390" cy="280" r="8"/>
  </g>
  <g id="ligand">
    <polygon points="378,251 352,236 326,251 326,281 352,296 378,281"
             fill="#f7ece0" stroke="#b26b36" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="352" cy="266" r="14" fill="none" stroke="#b26b36" stroke-width="3"/>
  </g>
  <g id="hydrogen-bonds" fill="none" stroke="#2a7b70" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round">
    <path d="M 326 251 L 328 244"/>
    <path d="M 326 281 L 326 292"/>
    <path d="M 378 281 L 384 280"/>
  </g>
</svg>
