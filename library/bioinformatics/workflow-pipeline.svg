<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Workflow Pipeline</title>
  <desc id="desc">Bioinformatics workflow pipeline with file input, filtering, DNA analysis and quality control steps.</desc>
  <!-- SciSVG — Saveena Solanki, CC BY 4.0, https://github.com/SaveenaSolanki/SciSVG -->
  <g id="steps" fill="#ffffff" stroke="#172033" stroke-width="4">
    <rect x="20" y="208" width="100" height="96" rx="14"/>
    <rect x="136" y="208" width="100" height="96" rx="14"/>
    <rect x="252" y="208" width="100" height="96" rx="14"/>
    <rect x="368" y="208" width="100" height="96" rx="14"/>
  </g>
  <g id="flow-arrows" fill="#8a94a6" stroke="none">
    <line x1="120" y1="256" x2="132" y2="256" stroke="#8a94a6" stroke-width="4"/>
    <polygon points="132,247 144,256 132,265"/>
    <line x1="236" y1="256" x2="248" y2="256" stroke="#8a94a6" stroke-width="4"/>
    <polygon points="248,247 260,256 248,265"/>
    <line x1="352" y1="256" x2="364" y2="256" stroke="#8a94a6" stroke-width="4"/>
    <polygon points="364,247 376,256 364,265"/>
  </g>
  <g id="step-file" fill="none" stroke="#3157a4" stroke-width="4" stroke-linejoin="round">
    <path d="M 56 238 L 76 238 L 84 246 L 84 282 L 56 282 Z"/>
    <line x1="60" y1="252" x2="80" y2="252" stroke-width="3"/>
    <line x1="60" y1="262" x2="80" y2="262" stroke-width="3"/>
    <line x1="60" y1="272" x2="74" y2="272" stroke-width="3"/>
  </g>
  <g id="step-filter" fill="#e5f1ee" stroke="#2a7b70" stroke-width="4" stroke-linejoin="round">
    <path d="M 52 232 L 88 232 L 70 252 L 70 276 L 62 276 L 62 252 Z"/>
    <line x1="70" y1="276" x2="70" y2="288" stroke="#2a7b70" stroke-width="4"/>
  </g>
  <g id="step-dna" fill="none" stroke="#b26b36" stroke-width="3.5" stroke-linecap="round">
    <path d="M 62 240 C 72 250 62 262 72 272"/>
    <path d="M 78 240 C 68 250 78 262 68 272"/>
    <line x1="66" y1="250" x2="74" y2="250" stroke-width="3"/>
    <line x1="64" y1="258" x2="76" y2="258" stroke-width="3"/>
    <line x1="66" y1="266" x2="74" y2="266" stroke-width="3"/>
  </g>
  <g id="step-qc" fill="#e5f1ee" stroke="#2a7b70" stroke-width="4">
    <circle cx="418" cy="256" r="20"/>
  </g>
  <g id="step-qc-check" fill="none" stroke="#2a7b70" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 408 256 L 416 266 L 430 246"/>
  </g>
</svg>
