  <g id="mRNA" stroke="#3f4c61" stroke-width="5" stroke-linecap="round">
    <line x1="80" y1="256" x2="432" y2="256"/>
  </g>
  <g id="codons">
    <rect x="140" y="262" width="18" height="22" rx="3" fill="#3157a4"/>
    <rect x="190" y="262" width="18" height="22" rx="3" fill="#2a7b70"/>
    <rect x="240" y="262" width="18" height="22" rx="3" fill="#b26b36"/>
    <rect x="290" y="262" width="18" height="22" rx="3" fill="#3157a4"/>
  </g>
  <g id="small-subunit">
