    <circle cx="168" cy="236" r="7" fill="#b26b36"/>
    <line x1="246" y1="190" x2="246" y2="226" stroke="#b26b36" stroke-width="4" stroke-linecap="round"/>
    <circle cx="246" cy="236" r="7" fill="#b26b36"/>
  </g>
  <g id="nascent-chain" stroke="#b26b36" stroke-width="4" fill="#b26b36">
    <line x1="336" y1="178" x2="352" y2="158" stroke-linecap="round"/>
    <line x1="352" y1="158" x2="368" y2="138" stroke-linecap="round"/>
    <circle cx="336" cy="178" r="6"/>
