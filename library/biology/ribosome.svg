<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Ribosome</title>
  <desc id="desc">Ribosome with mRNA, transfer RNAs and a nascent polypeptide chain.</desc>
