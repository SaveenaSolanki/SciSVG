<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" viewBox="0 0 512 512">
  <title id="title">Plasmid</title>
  <desc id="desc">
    Circular plasmid DNA with genes, origin of replication and a direction arrow.
  </desc>
<!--SciSVG — Saveena Solanki, CC BY 4.0, https://github.com/SaveenaSolanki/SciSVG-->
  <g id="plasmid-ring">
    <circle cx="256" cy="256" r="170" fill="#f7f9fc" stroke="#3f4c61" stroke-width="6"/>
  </g>
  <g id="genes" fill="none" stroke-linecap="round" stroke-width="13">
    <path stroke="#b26b36" d="M415.7 197.9A170 170 0 0 1 285.5 88.6"/>
    <path stroke="#2a7b70" d="M108.8 171a170 170 0 0 1 0 170"/>
  </g>
  <g id="origin-of-replication">
    <rect width="20" height="20" x="246" y="76" fill="#3157a4" rx="4"/>
  </g>
  <g id="direction-arrow">
    <polygon fill="#3f4c61" points="347,98 331,106 340,118"/>
  </g>
</svg>
