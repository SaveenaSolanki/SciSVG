<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" viewBox="0 0 512 512">
  <title id="title">DNA Double Helix</title>
  <desc id="desc">
    Double-stranded DNA helix with two-tone base pairs.
  </desc>
<!--SciSVG — Saveena Solanki, CC BY 4.0, https://github.com/SaveenaSolanki/SciSVG-->
  <g id="helix" transform="rotate(-16 256 256)">
    <g id="backbones" fill="none" stroke-linecap="round" stroke-width="8">
      <path stroke="#3157a4" d="M210 60c30 50-30 100 0 150s-30 100 0 150-10 80-20 92"/>
      <path stroke="#2a7b70" d="M302 60c-30 50 30 100 0 150s30 100 0 150 10 80 20 92"/>
    </g>
    <g id="base-pairs" stroke-width="6">
      <line x1="210" x2="256" y1="60" y2="60" stroke="#b26b36"/>
      <line x1="256" x2="302" y1="60" y2="60" stroke="#8a94a6"/>
      <line x1="210" x2="256" y1="110" y2="110" stroke="#b26b36"/>
      <line x1="256" x2="302" y1="110" y2="110" stroke="#8a94a6"/>
      <line x1="210" x2="256" y1="160" y2="160" stroke="#b26b36"/>
      <line x1="256" x2="302" y1="160" y2="160" stroke="#8a94a6"/>
      <line x1="210" x2="256" y1="210" y2="210" stroke="#b26b36"/>
      <line x1="256" x2="302" y1="210" y2="210" stroke="#8a94a6"/>
      <line x1="210" x2="256" y1="260" y2="260" stroke="#b26b36"/>
      <line x1="256" x2="302" y1="260" y2="260" stroke="#8a94a6"/>
      <line x1="210" x2="256" y1="310" y2="310" stroke="#b26b36"/>
      <line x1="256" x2="302" y1="310" y2="310" stroke="#8a94a6"/>
      <line x1="210" x2="256" y1="360" y2="360" stroke="#b26b36"/>
      <line x1="256" x2="302" y1="360" y2="360" stroke="#8a94a6"/>
      <line x1="210" x2="256" y1="410" y2="410" stroke="#b26b36"/>
      <line x1="256" x2="302" y1="410" y2="410" stroke="#8a94a6"/>
    </g>
    <g id="ends">
      <circle cx="210" cy="60" r="10" fill="#3157a4"/>
      <circle cx="302" cy="60" r="10" fill="#2a7b70"/>
      <circle cx="190" cy="452" r="10" fill="#3157a4"/>
      <circle cx="322" cy="452" r="10" fill="#2a7b70"/>
    </g>
  </g>
</svg>
