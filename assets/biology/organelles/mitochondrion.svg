    <path d="M404 232c-40-24-40 20-86 2"/>
    <path d="M404 268c-42-20-42 20-86 2"/>
    <path d="M404 300c-38-18-38 20-86 4"/>
  </g>
  <g id="matrix" fill="#b26b36">
