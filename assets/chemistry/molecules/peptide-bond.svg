<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" viewBox="0 0 512 512">
  <title id="title">Peptide Bond</title>
  <desc id="desc">
    Two amino acids joined by a highlighted peptide bond with atom-style coloring.
  </desc>
<!--SciSVG — Saveena Solanki, CC BY 4.0, https://github.com/SaveenaSolanki/SciSVG-->
  <g id="bonds" stroke="#3f4c61" stroke-linecap="round" stroke-width="6">
    <line x1="118" x2="162" y1="190" y2="256"/>
    <line x1="184" x2="240" y1="260" y2="244"/>
    <line x1="260" x2="290" y1="232" y2="214"/>
    <line x1="258" x2="288" y1="248" y2="230"/>
    <line x1="360" x2="408" y1="296" y2="320"/>
    <line x1="430" x2="458" y1="322" y2="268"/>
    <line x1="474" x2="494" y1="246" y2="228"/>
    <line x1="470" x2="490" y1="252" y2="234"/>
    <line x1="170" x2="166" y1="276" y2="326"/>
    <line x1="422" x2="440" y1="338" y2="380"/>
  </g>
  <g id="peptide-bond" stroke="#b26b36" stroke-linecap="round" stroke-width="9">
