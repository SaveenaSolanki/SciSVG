    <circle cx="350" cy="286" r="14" fill="#3157a4"/>
    <circle cx="418" cy="330" r="16" fill="#3f4c61"/>
    <circle cx="468" cy="258" r="15" fill="#3f4c61"/>
    <circle cx="498" cy="230" r="13" fill="#d64545"/>
  </g>
  <g id="side-chains" fill="#2a7b70">
