    <line x1="236" x2="248" y1="256" y2="256" stroke="#8a94a6" stroke-width="4"/>
    <polygon points="248,247 260,256 248,265"/>
    <line x1="352" x2="364" y1="256" y2="256" stroke="#8a94a6" stroke-width="4"/>
    <polygon points="364,247 376,256 364,265"/>
  </g>
  <g id="step-file" fill="none" stroke="#3157a4" stroke-linejoin="round" stroke-width="4">
