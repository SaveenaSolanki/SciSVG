<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" viewBox="0 0 512 512">
  <title id="title">Workflow Pipeline</title>
  <desc id="desc">
    Bioinformatics workflow pipeline with file input, filtering, DNA analysis and quality control steps.
  </desc>
