name: Validate SVGs

on:
  push:
    branches: [main]
    paths:
      - "assets/**"
      - "metadata/**"
      - "scripts/**"
      - "tests/**"
  pull_request:
    paths:
      - "assets/**"
      - "metadata/**"
      - "scripts/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install lxml pytest

      - name: Validate SVGs
        run: python scripts/validate_svgs.py

      - name: Metadata checks
        run: |
          python scripts/check_metadata.py
          python scripts/check_duplicates.py

      - name: Run test suite
        run: pytest -q
