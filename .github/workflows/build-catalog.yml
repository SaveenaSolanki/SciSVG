name: Build SVG catalog

on:
  push:
    branches: [main]
    paths:
      - "library/**/*.svg"
      - "scripts/build_catalog.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build catalog
        run: python scripts/build_catalog.py

      - name: Commit catalog if changed
        run: |
          if git diff --quiet -- docs/catalog.json; then
            echo "Catalog unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/catalog.json
          git commit -m "chore: rebuild SVG catalog"
          git push
